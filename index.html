<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VCUBE - Industrial 3D Printing & Engineering Platform</title>
    <meta name="description" content="Nền tảng in 3D chuyên nghiệp hàng đầu Việt Nam - VCUBE. Độ chính xác công nghiệp, vật liệu đa dạng, giao hàng nhanh chóng." />
    <!-- Theme (light/dark) do src/frontend/theme/ThemeProvider.tsx quản lý: gắn/bỏ class="dark" trên <html>. -->
    <!-- Favicon: trước đây KHÔNG có (0 thẻ rel="icon", không có public/)
         => tab trình duyệt hiện icon trống/404. public/favicon.svg là mark VCUBE (khối lập phương). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Màu thanh trình duyệt trên mobile, khớp token --color-canvas của từng theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080D16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-canvas text-fg font-sans antialiased selection:bg-primary selection:text-primary-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
