name: CI

# PR-1 — cổng CI tối thiểu, tất định, KHÔNG cần `.env` cho job offline.
# Job offline chạy đúng các gate trong scripts/gate-manifest.json có thể chạy khi không có
# Supabase sống: lint, unit test, build, 4 guard (dòng/any/ranh giới/vòng import) và các
# checker tĩnh. Live gate (verify-rls / inspect-db / test-catalog-sync) chỉ chạy khi repo đã
# cấu hình secret; thiếu secret thì bỏ qua, không làm đỏ PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gates:
    name: Offline gates (lint · test · build · guard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck (npm run lint)
        run: npm run lint

      - name: Unit tests (npm run test:unit)
        run: npm run test:unit

      # QA-API-01: harness API/DB. Dry-run mặc định, KHÔNG cần .env và KHÔNG gọi mạng —
      # chỉ kiểm fixture (prefix E2E-, token, tổng tiền). Đây là self-test của harness,
      # KHÔNG chứng minh vòng tiền (live write nằm ở job `live-gates`, cần staging secret).
      - name: E2E API harness (dry-run, fixture only)
        run: npm run test:e2e:api

      - name: Build (npm run build)
        run: npm run build

      - name: Guard — file ≤800 dòng
        run: node scripts/check-max-lines.mjs

      - name: Guard — ngân sách `any`
        run: node scripts/check-any-budget.mjs

      - name: Guard — ranh giới frontend/backend
        run: node scripts/check-import-boundaries.mjs

      - name: Guard — vòng import
        run: node scripts/check-import-cycles.mjs

      # Các checker tĩnh còn lại trong gate-manifest.json (id có `offline: true` / không `live`).
      # Dùng --no-baseline: CI chỉ cần gate xanh (RC=0), không so số vi phạm lịch sử.
      - name: Offline checkers (manifest)
        run: |
          node scripts/run-checks.mjs --no-baseline \
            --only check-contrast-combos \
            --only check-contrast \
            --only check-error-handling \
            --only check-fabricated \
            --only check-icon-names \
            --only check-icon-library \
            --only check-ui-rules \
            --only check-unitprice-multiplier \
            --only a8-sql-syntax-check \
            --only lint-rls-migration \
            --only lint-rls-sources

  live-gates:
    name: Live Supabase gates (chỉ khi có secret)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      # `secrets` không dùng được trong `if` của GitHub Actions, nên dò bằng step + GITHUB_OUTPUT.
      - name: Detect Supabase secrets
        id: detect
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Thiếu secret Supabase — bỏ qua live gate (verify-rls/inspect-db/test-catalog-sync)."
          fi

      # Các script live đọc `.env` (parseEnv), nên dựng file từ secret chỉ trong job này.
      - name: Write .env from secrets
        if: steps.detect.outputs.present == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
            printf 'VITE_SITE_URL=%s\n' "${VITE_SITE_URL:-http://localhost:3000}"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
          } > .env

      - name: Live RLS gates
        if: steps.detect.outputs.present == 'true'
        run: node scripts/run-checks.mjs --only verify-rls --only inspect-db

      - name: Catalog sync integration
        if: steps.detect.outputs.present == 'true'
        run: npx tsx scripts/test-catalog-sync.ts

      # QA-API-01 — live write chỉ chạy khi (a) có secret STAGING riêng và (b) repo variable
      # `E2E_LIVE_WRITE=true`. Dùng secret staging riêng để không bao giờ ghi nhầm production.
      - name: Detect staging E2E secrets
        id: e2e
        env:
          E2E_STAGING_SUPABASE_URL: ${{ secrets.E2E_STAGING_SUPABASE_URL }}
          E2E_STAGING_PUBLISHABLE_KEY: ${{ secrets.E2E_STAGING_PUBLISHABLE_KEY }}
          E2E_STAGING_SECRET_KEY: ${{ secrets.E2E_STAGING_SECRET_KEY }}
        run: |
          if [ -n "$E2E_STAGING_SUPABASE_URL" ] && [ -n "$E2E_STAGING_PUBLISHABLE_KEY" ] && [ -n "$E2E_STAGING_SECRET_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Không có secret staging E2E — bỏ qua live write (QA-API-01 chỉ dry-run)."
          fi

      - name: Write staging env file for E2E
        if: steps.e2e.outputs.present == 'true'
        env:
          E2E_STAGING_SUPABASE_URL: ${{ secrets.E2E_STAGING_SUPABASE_URL }}
          E2E_STAGING_PUBLISHABLE_KEY: ${{ secrets.E2E_STAGING_PUBLISHABLE_KEY }}
          E2E_STAGING_SECRET_KEY: ${{ secrets.E2E_STAGING_SECRET_KEY }}
        run: |
          umask 077
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$E2E_STAGING_SUPABASE_URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$E2E_STAGING_PUBLISHABLE_KEY"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$E2E_STAGING_SECRET_KEY"
          } > /tmp/e2e-staging.env

      # Dry-run với env STAGING: chỉ ĐỌC bảng `products`, không ghi DB (không dùng production).
      - name: E2E API dry-run (staging, read-only)
        if: steps.e2e.outputs.present == 'true'
        env:
          E2E_ENV_FILE: /tmp/e2e-staging.env
          E2E_TARGET: staging
        run: npm run test:e2e:api -- --json --report e2e-api-dryrun.json

      - name: E2E API live write (staging, opt-in)
        if: steps.e2e.outputs.present == 'true' && vars.E2E_LIVE_WRITE == 'true'
        env:
          E2E_ENV_FILE: /tmp/e2e-staging.env
          E2E_ALLOW_LIVE: '1'
          E2E_TARGET: staging
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_STAGING_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
        run: npm run test:e2e:api -- --live --admin-session --cleanup --json --report e2e-api-live.json

      - name: E2E API report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-api-01-report
          path: e2e-api-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Skipped (no secrets)
        if: steps.detect.outputs.present != 'true'
        run: echo "Live gate bỏ qua — thiếu secret Supabase (verify-rls/inspect-db/test-catalog-sync/QA-API-01)."
